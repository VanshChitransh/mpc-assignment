# Root workspace Cargo.toml
[workspace]
members = [
    "backend",
    "store", 
    "mpc",
]
exclude = [
    "indexer",
]
resolver = "2"

[workspace.dependencies]
# Common dependencies across workspace
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
anyhow = "1.0"
thiserror = "1.0"
dotenvy = "0.15"

# Remove conflicting patches or fix them
[patch.crates-io]
# Only include patches if you specifically need them
# Remove or comment out conflicting curve25519-dalek patches