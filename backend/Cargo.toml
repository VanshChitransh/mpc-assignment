[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-cors = "0.6.4"
tokio = { version = "1.32", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
log = "0.4"
thiserror = "1.0"
jsonwebtoken = "9.0"
bcrypt = "0.15"
uuid = { version = "1.4", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-actix-web = "0.7"
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"
bs58 = "0.4" # For Solana address encoding
hex = "0.4" # For hex encoding/decoding
base64 = "0.21" # For base64 encoding/decoding
sha2 = "0.10" # For hashing
lazy_static = "1.4" # For static metrics
prometheus = { version = "0.13", features = ["process"] } # For metrics
rand = "0.8" # For random number generation
async-trait = "0.1" # For async traits


# Internal crates
store = { path = "../store" }
futures-util = "0.3.31"

[[bin]]
name = "backend"
path = "src/main.rs"
