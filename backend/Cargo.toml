[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
# Web framework
actix-web = "4.11.0"

# Async runtime
tokio = { version = "1.47.1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }

# Authentication
jsonwebtoken = "9"
bcrypt = "0.15"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
env_logger = "0.11"

# Environment
dotenv = "0.15"

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# HTTP client (for MPC communication)
reqwest = { version = "0.11", features = ["json"] }

# NEW: Missing dependencies for Step 3.3
futures-util = "0.3"
futures = "0.3"

# NEW: Missing dependencies for MPC service
thiserror = "1.0"
rand = "0.8"

[dev-dependencies]
actix-http-test = "3"