[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
# Web framework
actix-web = "4.11"
actix-cors = "0.7"

# Async runtime
tokio = { version = "1.47", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Auth & Security
jsonwebtoken = "9.0"
bcrypt = "0.15"

# Time & IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.4", features = ["v4", "serde"] }

# Networking
reqwest = { version = "0.11", features = ["json"] }

# Encoding / Hashing
base64 = "0.22"
bs58 = "0.5"
hex = "0.4"

# Solana
solana-sdk = "2.0"
solana-client = "2.0"
solana-transaction-status = "2.0"
spl-token = "6.0"
spl-associated-token-account = "5.0"

# Error handling
thiserror = "2.0"

# Async utilities
futures-util = "0.3"

# Environment
dotenv = "0.15"

# Misc utils
bincode = "1.3"
rand = "0.8"

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
store = { path = "../store" }