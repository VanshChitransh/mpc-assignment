[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-cors = "0.7"
jsonwebtoken = "9.2"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
env_logger = "0.10"
dotenv = "0.15"
store = { path = "../store" }
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
tracing-actix-web = "0.7"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
serde_json = "1.0"
futures-util = "0.3"
regex = "1.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Encoding/decoding dependencies
base64 = "0.21"
bincode = "1.3"
hex = "0.4"
bs58 = "0.5"

# Cryptographic dependencies
sha2 = "0.10"

# Note: bcrypt is now included in the store crate dependency
futures = "0.3"

# API Layer dependencies
utoipa = { version = "4.2", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "6.0", features = ["actix-web"] }
prometheus = "0.13"
lazy_static = "1.4"

[dev-dependencies]
actix-web = { version = "4.4", features = ["macros"] }
serde_json = "1.0"
jsonwebtoken = "9.2"
