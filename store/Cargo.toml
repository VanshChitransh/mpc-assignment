[package]
name = "store"
version = "0.1.0"
edition = "2021"

[dependencies]
# Database - without offline feature (we'll use SQLX_OFFLINE env var)
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls", 
    "postgres", 
    "chrono", 
    "uuid", 
    "migrate", 
    "json",
    "bigdecimal",
    "macros"
] }

# Cryptography and password hashing
bcrypt = "0.15"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID support
uuid = { version = "1.0", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
# Decimal support
rust_decimal = { version = "1.32", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"


# Async runtime
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1.41"

[dev-dependencies]
# Testing
tokio-test = "0.4"

[[bin]]
name = "store_test"
path = "src/bin/test.rs"

[[bin]]
name = "verify_db"
path = "src/bin/verify_db.rs"

[[bin]]
name = "schema_validation"
path = "src/bin/schema_validation.rs"
